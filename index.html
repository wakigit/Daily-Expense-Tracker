<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Expense Tracker"/>
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<style>
:root{
  --bg:#FFB3CE;
  --surface-rgb:255,255,255;
  --tint-rgb:255,228,238;
  --border-rgb:222,162,182;
  --text:#3A1A2E;
  --text-sub:#8A5870;
  --text-muted:#C09AAA;
  --text-faint:#B07090;
  --label:#C0708A;
  --heading-sub:#7A4060;
  --chevron:#D4A0B8;
  --nav-arrow:#C08098;
  --accent:#E8709A;
  --accent-rgb:232,112,154;
  --accent-hover:#D96090;
  --on-accent:#fff;
  --success:#2D8B60;
  --danger:#C04040;
  --danger-rgb:192,64,64;
  --danger-border:#E8A0B0;
  --overlay:rgba(58,26,46,0.4);
  --credit-rgb:176,112,144;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;min-height:100vh;color:var(--text);background:var(--bg)}
.app{max-width:430px;margin:0 auto;padding:1rem 0.9rem 5.5rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.display{font-family:'Caprasimo',cursive;font-weight:400}
.card{background:rgba(var(--surface-rgb),0.68);border:1px solid rgba(var(--border-rgb),0.45);border-radius:18px;padding:1.1rem 1.2rem;margin-bottom:0.9rem;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.lbl{font-family:'Caprasimo',cursive;font-size:13px;color:var(--label);margin:0 0 0.9rem;letter-spacing:0.01em}
.field{margin-bottom:0.9rem}
.field label{font-size:13px;color:var(--text-sub);display:block;margin-bottom:5px;font-weight:500}
input,select{background:rgba(var(--surface-rgb),0.82);border:1.5px solid rgba(var(--border-rgb),0.55);color:var(--text);padding:12px 14px;border-radius:13px;font-family:inherit;font-size:15px;width:100%;outline:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s;min-height:48px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.13)}
input[type=date]{color-scheme:light}
input.err{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(var(--danger-rgb),0.13)!important}
button{background:rgba(var(--surface-rgb),0.72);border:1.5px solid rgba(var(--border-rgb),0.6);color:var(--text);padding:10px 16px;border-radius:13px;font-family:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;transition:all .12s;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button:hover{background:rgba(var(--surface-rgb),0.88)}
button:active{transform:scale(.97)}
.btn-primary{background:var(--accent);border:none;color:var(--on-accent);font-weight:600;box-shadow:0 3px 14px rgba(var(--accent-rgb),0.32)}
.btn-primary:hover{background:var(--accent-hover)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(var(--tint-rgb),0.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(var(--border-rgb),0.4);display:flex;align-items:center;justify-content:space-around;padding:6px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;min-height:auto;padding:7px 14px;border-radius:14px;color:var(--text-muted);font-size:10px;font-weight:500}
.nav-btn.active{color:var(--accent);background:rgba(var(--accent-rgb),0.13)}
.progress-track{background:rgba(var(--border-rgb),0.28);border-radius:4px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
.txn-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-radius:12px}
.txn-row:active{background:rgba(var(--accent-rgb),0.07)}
.icon-btn{background:transparent;border:none;padding:6px;min-height:40px;min-width:40px;border-radius:10px;font-size:16px;color:var(--text-muted);cursor:pointer}
.icon-btn:active{background:rgba(var(--accent-rgb),0.1);transform:scale(.9)}
.danger-zone{background:rgba(var(--danger-rgb),0.18);padding:9px 12px;border-radius:0 0 12px 12px}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:border-color .12s;-webkit-tap-highlight-color:transparent}
.swatch.sel{border-color:var(--text)}
.cancel-link{background:transparent;border:none;color:var(--text-faint);font-size:13px;padding:6px;text-decoration:underline;min-height:auto}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:200;display:flex;align-items:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{background:rgba(var(--tint-rgb),0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px 24px 0 0;width:100%;max-height:68vh;overflow-y:auto;padding:.75rem 1rem max(1.5rem,env(safe-area-inset-bottom))}
.handle{width:38px;height:4px;background:rgba(var(--border-rgb),0.6);border-radius:2px;margin:0 auto 1rem}
.m-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:13px;cursor:pointer;margin-bottom:3px;-webkit-tap-highlight-color:transparent}
.m-item:active{background:rgba(var(--accent-rgb),0.18)}
.m-item.sel{background:rgba(var(--accent-rgb),0.13)}
.yr-hdr{font-family:'Caprasimo',cursive;font-size:11px;color:var(--label);padding:8px 12px 4px;letter-spacing:.06em}
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
.hist-row:active{background:rgba(var(--accent-rgb),0.08)}
.cat-row{cursor:pointer;padding:4px;border-radius:10px;margin-bottom:14px;-webkit-tap-highlight-color:transparent}
.cat-row:active{background:rgba(var(--accent-rgb),0.06)}
.theme-card{cursor:pointer;padding:10px;border-radius:14px;border:2px solid transparent;-webkit-tap-highlight-color:transparent}
.theme-card.sel{border-color:var(--accent);background:rgba(var(--accent-rgb),0.08)}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="root"></div>

<script>
function bow(cx,cy,hw,hh,item,rot){const[fill,knot]=item;const g0=rot?`<g transform="rotate(${rot} ${cx} ${cy})">`:'<g>';const lw=`M${cx},${cy} Q${cx-hw*.38},${cy-hh} ${cx-hw},${cy} Q${cx-hw},${cy} ${cx-hw*.38},${cy+hh} ${cx},${cy}Z`;const rw=`M${cx},${cy} Q${cx+hw*.38},${cy-hh} ${cx+hw},${cy} Q${cx+hw},${cy} ${cx+hw*.38},${cy+hh} ${cx},${cy}Z`;const kr=Math.max(4,hh*.34);const dx=cx-hw*.55,dxr=cx+hw*.55,dy0=cy-hh*.22,dy1=cy+hh*.22;return`${g0}<path d="${lw}" fill="${fill}" opacity="0.9"/><path d="${rw}" fill="${fill}" opacity="0.9"/><circle cx="${dx}" cy="${dy0}" r="1.8" fill="white" opacity="0.62"/><circle cx="${dx}" cy="${dy1}" r="1.8" fill="white" opacity="0.62"/><circle cx="${dxr}" cy="${dy0}" r="1.8" fill="white" opacity="0.62"/><circle cx="${dxr}" cy="${dy1}" r="1.8" fill="white" opacity="0.62"/><circle cx="${cx}" cy="${cy}" r="${kr}" fill="${knot}"/></g>`;}
function mahjongTile(cx,cy,hw,hh,type,rot){
  const w=hw*1.9,h=w*1.32,x=cx-w/2,y=cy-h/2;
  const g0=rot?`<g transform="rotate(${rot} ${cx} ${cy})">`:'<g>';
  const body=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w*0.14}" fill="#F6EBD9" stroke="#D8C39A" stroke-width="1.4"/><rect x="${x+w*0.09}" y="${y+h*0.09}" width="${w*0.82}" height="${h*0.82}" rx="${w*0.1}" fill="none" stroke="#EAD9B8" stroke-width="1"/>`;
  let glyph;
  if(type==='zhong')glyph=`<text x="${cx}" y="${cy+h*0.17}" font-family="'PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="${h*0.6}" font-weight="700" fill="#B3222E" text-anchor="middle">中</text>`;
  else if(type==='facai')glyph=`<text x="${cx}" y="${cy+h*0.17}" font-family="'PingFang SC','Microsoft YaHei','Heiti SC',sans-serif" font-size="${h*0.6}" font-weight="700" fill="#2E7D4F" text-anchor="middle">發</text>`;
  else glyph=`<rect x="${cx-w*0.24}" y="${cy-h*0.24}" width="${w*0.48}" height="${h*0.48}" fill="none" stroke="#2B4C7E" stroke-width="${w*0.045}"/>`;
  return `${g0}${body}${glyph}</g>`;
}
const ICON_LAYOUT=[[58,52,23,15,0],[188,30,18,11,15],[316,68,23,15,-10],[82,155,21,13,5],[230,130,26,16,0],[350,195,20,13,-15],[132,238,22,14,10],[275,250,20,12,0],[162,108,17,11,-20],[360,138,21,13,6],[14,198,18,11,12],[205,200,20,12,-8],[22,88,16,10,-5],[378,30,17,11,8]];
const MAHJONG_LAYOUT=[[45,60,16,0,-4],[150,40,18,0,5],[260,55,15,0,-6],[350,80,17,0,4],[90,150,19,0,-3],[210,140,16,0,6],[330,175,15,0,-5],[55,230,17,0,3],[170,225,18,0,-4],[290,245,16,0,5]];

function sceneBox(){return{w:Math.min(window.innerWidth,430),h:window.innerHeight};}
function forestScene(){
  const{w,h}=sceneBox();
  const stars=Array.from({length:14}).map((_,i)=>{const x=(i*37+13)%Math.round(w),y=h*0.02+((i*53)%Math.round(h*0.27)),r=(1+((i*7)%3)*0.4).toFixed(1),o=(0.35+((i*13)%50)/100).toFixed(2);return`<circle cx="${x}" cy="${y.toFixed(0)}" r="${r}" fill="#fff" opacity="${o}"/>`;}).join('');
  const treeScale=w/390;
  const pine=(xf,baseYf,s)=>`<g transform="translate(${(xf*w).toFixed(0)} ${(baseYf*h).toFixed(0)}) scale(${(s*treeScale).toFixed(3)})"><path d="M0,-64 L18,-22 L9,-22 L26,10 L14,10 L30,40 L-30,40 L-14,10 L-26,10 L-9,-22 L-18,-22 Z" fill="#0E1524"/></g>`;
  const trees=[[0.05,0.71,0.55],[0.13,0.706,0.7],[0.23,0.716,0.5],[0.33,0.702,0.85],[0.43,0.71,0.6],[0.54,0.704,0.75],[0.65,0.714,0.55],[0.75,0.699,0.9],[0.85,0.709,0.62],[0.94,0.716,0.5]].map(t=>pine(...t)).join('');
  const moonR=Math.min(w,h)*0.062,moonX=w*0.75,moonY=h*0.155,hill1Y=h*0.663,hill2Y=h*0.71,lakeY=h*0.735;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:fixed;top:0;left:50%;transform:translateX(-50%);width:${w}px;height:${h}px;z-index:-1;pointer-events:none"><defs><linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0A0F24"/><stop offset="55%" stop-color="#182B4A"/><stop offset="100%" stop-color="#274566"/></linearGradient><radialGradient id="fMoon" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFFBEF"/><stop offset="70%" stop-color="#F6E6B8"/><stop offset="100%" stop-color="#E9CE8E"/></radialGradient><linearGradient id="fLake" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22405F"/><stop offset="100%" stop-color="#0A1526"/></linearGradient><linearGradient id="fGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F6E6B8" stop-opacity="0.55"/><stop offset="100%" stop-color="#F6E6B8" stop-opacity="0"/></linearGradient><filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="${w}" height="${h}" fill="url(#fSky)"/>${stars}<circle cx="${moonX}" cy="${moonY}" r="${moonR*2.1}" fill="#F6E6B8" opacity="0.22" filter="url(#fBlur)"/><circle cx="${moonX}" cy="${moonY}" r="${moonR}" fill="url(#fMoon)"/><path d="M0,${hill1Y} Q${w*0.25},${hill1Y-40} ${w*0.5},${hill1Y-28} T${w},${hill1Y-46} V${h} H0 Z" fill="#20385A" opacity="0.85"/><path d="M0,${hill2Y} Q${w*0.28},${hill2Y-34} ${w*0.5},${hill2Y-22} T${w},${hill2Y-42} V${h} H0 Z" fill="#16223A"/>${trees}<rect x="0" y="${lakeY}" width="${w}" height="${h-lakeY}" fill="url(#fLake)"/><rect x="${moonX-w*0.056}" y="${lakeY}" width="${w*0.113}" height="${h-lakeY}" fill="url(#fGlow)"/></svg>`;
}
function beachScene(){
  const{w,h}=sceneBox();
  const horizonY=h*0.557;
  const wave=(yf,c,o)=>`<path d="M0,${h*yf} Q${w*0.167},${h*yf-14} ${w*0.333},${h*yf} T${w*0.667},${h*yf} T${w},${h*yf-6} V${h} H0 Z" fill="${c}" opacity="${o}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:fixed;top:0;left:50%;transform:translateX(-50%);width:${w}px;height:${h}px;z-index:-1;pointer-events:none"><defs><linearGradient id="bSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3B2A5C"/><stop offset="45%" stop-color="#B4506B"/><stop offset="75%" stop-color="#F0925A"/><stop offset="100%" stop-color="#FBCB82"/></linearGradient><radialGradient id="bSun" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF7DE"/><stop offset="60%" stop-color="#FDCB7C"/><stop offset="100%" stop-color="#F79B5C"/></radialGradient><linearGradient id="bSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0925A"/><stop offset="18%" stop-color="#C97A6E"/><stop offset="55%" stop-color="#2F6E79"/><stop offset="100%" stop-color="#123240"/></linearGradient><linearGradient id="bGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFE3AE" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFE3AE" stop-opacity="0"/></linearGradient><filter id="bBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter></defs><rect width="${w}" height="${h}" fill="url(#bSky)"/><ellipse cx="${w*0.28}" cy="${h*0.178}" rx="${w*0.18}" ry="${h*0.028}" fill="#E9BFD2" opacity="0.28" filter="url(#bBlur)"/><ellipse cx="${w*0.77}" cy="${h*0.249}" rx="${w*0.14}" ry="${h*0.021}" fill="#E9BFD2" opacity="0.22" filter="url(#bBlur)"/><circle cx="${w*0.5}" cy="${horizonY}" r="${Math.min(w,h)*0.28}" fill="#FDCB7C" opacity="0.28" filter="url(#bBlur)"/><circle cx="${w*0.5}" cy="${horizonY}" r="${Math.min(w,h)*0.159}" fill="url(#bSun)"/><rect y="${horizonY}" width="${w}" height="${h-horizonY}" fill="url(#bSea)"/><rect x="${w*0.418}" y="${horizonY}" width="${w*0.164}" height="${h-horizonY}" fill="url(#bGlow)"/>${wave(0.9,'#1C4C58',0.85)}${wave(0.947,'#153B45',0.9)}</svg>`;
}
function paintBackground(theme){
  const bgEl=document.getElementById('bg');
  if(theme.bgKind==='scene'){
    bgEl.innerHTML=theme.scene==='forest'?forestScene():beachScene();
    return;
  }
  const isMahjong=theme.iconType==='mahjong';
  const drawIcon=isMahjong?mahjongTile:bow;
  const layout=isMahjong?MAHJONG_LAYOUT:ICON_LAYOUT;
  const icons=layout.map((pos,i)=>drawIcon(pos[0],pos[1],pos[2],pos[3],theme.items[i%theme.items.length],pos[4])).join('');
  bgEl.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none"><defs><pattern id="pk" x="10" y="10" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="2.8" fill="${theme.dot}"/></pattern><pattern id="mp" x="0" y="0" width="390" height="285" patternUnits="userSpaceOnUse"><rect width="390" height="285" fill="${theme.vars['--bg']}"/><rect width="390" height="285" fill="url(#pk)"/>${icons}</pattern></defs><rect width="100%" height="100%" fill="url(#mp)"/></svg>`;
}
paintBackground({bgKind:'pattern',dot:'rgba(255,255,255,0.38)',vars:{'--bg':'#FFB3CE'},items:[['#A8D8F0','#78B8D4'],['#F7E8A0','#D4C060'],['#E8C0F0','#B890D4'],['#B8F0C8','#78D490'],['#F0B8C8','#D480A8']]});
</script>

<script>
const {useState,useEffect,useRef,useMemo}=React;
const PALETTE=['#D85A30','#1D9E75','#378ADD','#7F77DD','#BA7517','#888780','#D4537E','#639922','#E24B4A','#5DCAA5','#EF9F27','#534AB7','#E8709A','#60B0E0'];
const DEF_CATS=[{id:'food',label:'Food',color:'#D85A30'},{id:'hire',label:'Private hire',color:'#1D9E75'},{id:'pub',label:'Public transport',color:'#378ADD'},{id:'shop',label:'Shopping',color:'#7F77DD'},{id:'needs',label:'Needs',color:'#BA7517'},{id:'misc',label:'Miscellaneous',color:'#888780'}];
const fmt=n=>Number(n).toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
const curYm=()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;};
const ymLabel=ym=>{const[y,m]=ym.split('-');return new Date(y,m-1).toLocaleString('en-SG',{month:'long',year:'numeric'});};

const THEMES=[
  {id:'pink',name:'Pink Bow',emoji:'🎀',bgKind:'pattern',iconType:'bow',dot:'rgba(255,255,255,0.38)',preview:['#FFB3CE','#E8709A'],
    vars:{'--bg':'#FFB3CE','--surface-rgb':'255,255,255','--tint-rgb':'255,228,238','--border-rgb':'222,162,182',
      '--text':'#3A1A2E','--text-sub':'#8A5870','--text-muted':'#C09AAA','--text-faint':'#B07090',
      '--label':'#C0708A','--heading-sub':'#7A4060','--chevron':'#D4A0B8','--nav-arrow':'#C08098',
      '--accent':'#E8709A','--accent-rgb':'232,112,154','--accent-hover':'#D96090','--on-accent':'#fff',
      '--success':'#2D8B60','--danger':'#C04040','--danger-rgb':'192,64,64','--danger-border':'#E8A0B0',
      '--overlay':'rgba(58,26,46,0.4)','--credit-rgb':'176,112,144'},
    items:[['#A8D8F0','#78B8D4'],['#F7E8A0','#D4C060'],['#E8C0F0','#B890D4'],['#B8F0C8','#78D490'],['#F0B8C8','#D480A8']]},
  {id:'ocean',name:'Ocean Breeze',emoji:'🌊',bgKind:'pattern',iconType:'bow',dot:'rgba(255,255,255,0.45)',preview:['#AEDFF5','#2E86C1'],
    vars:{'--bg':'#AEDFF5','--surface-rgb':'255,255,255','--tint-rgb':'224,244,255','--border-rgb':'150,190,215',
      '--text':'#16323F','--text-sub':'#3E6270','--text-muted':'#87B0BE','--text-faint':'#5A8493',
      '--label':'#1E7896','--heading-sub':'#215062','--chevron':'#8FC3D3','--nav-arrow':'#5C97A8',
      '--accent':'#2E86C1','--accent-rgb':'46,134,193','--accent-hover':'#216FA3','--on-accent':'#fff',
      '--success':'#1F8A5F','--danger':'#C0392B','--danger-rgb':'192,57,43','--danger-border':'#E6A199',
      '--overlay':'rgba(10,35,48,0.45)','--credit-rgb':'90,140,155'},
    items:[['#FFE8A0','#D4C060'],['#FFC7D6','#E8A0B8'],['#C8ECFA','#7FC0DA'],['#C3F0DC','#6FCBA0'],['#D8CFF5','#A899DD']]},
  {id:'lavender',name:'Lavender Dream',emoji:'💜',bgKind:'pattern',iconType:'bow',dot:'rgba(255,255,255,0.42)',preview:['#E1D2F7','#8B5FBF'],
    vars:{'--bg':'#E1D2F7','--surface-rgb':'255,255,255','--tint-rgb':'240,230,251','--border-rgb':'193,163,214',
      '--text':'#2C1A3D','--text-sub':'#5C4570','--text-muted':'#AE93C4','--text-faint':'#8E70A8',
      '--label':'#7A48B0','--heading-sub':'#4E2E6B','--chevron':'#C4A3DA','--nav-arrow':'#9F7CB8',
      '--accent':'#8B5FBF','--accent-rgb':'139,95,191','--accent-hover':'#7247A5','--on-accent':'#fff',

function Donut({data,size=130,inner=38,outer=58}){
  const total=data.reduce((s,d)=>s+d.value,0);if(!total)return null;
  const cx=size/2,cy=size/2;let a=-Math.PI/2;
  const slices=data.map(d=>{const sw=(d.value/total)*2*Math.PI,x1=cx+outer*Math.cos(a),y1=cy+outer*Math.sin(a);a+=sw;const x2=cx+outer*Math.cos(a),y2=cy+outer*Math.sin(a),ix1=cx+inner*Math.cos(a-sw),iy1=cy+inner*Math.sin(a-sw),ix2=cx+inner*Math.cos(a),iy2=cy+inner*Math.sin(a),big=sw>Math.PI?1:0;return{...d,path:`M${x1},${y1} A${outer},${outer} 0 ${big} 1 ${x2},${y2} L${ix2},${iy2} A${inner},${inner} 0 ${big} 0 ${ix1},${iy1} Z`};});
  return React.createElement('svg',{width:size,height:size,viewBox:`0 0 ${size} ${size}`},slices.map((s,i)=>React.createElement('path',{key:i,d:s.path,fill:s.color})));
}

function App(){
  const[ready,setReady]=useState(false);
  const[appName,setAppName]=useState('Expense Tracker');
  const[themeId,setThemeId]=useState('pink');
  const[cats,setCats]=useState(DEF_CATS);
  const[expenses,setExp]=useState([]);
  const[budgets,setBudgets]=useState({});
  const[ym,setYm]=useState(curYm());
  const[tab,setTab]=useState('home');
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState({date:today(),category:'food',description:'',amount:'',notes:''});
  const[budDraft,setBudDraft]=useState({});
  const[delExpId,setDelExpId]=useState(null);
  const[delCatId,setDelCatId]=useState(null);
  const[newCat,setNewCat]=useState({label:'',color:'#D85A30'});
  const[saved,setSaved]=useState(false);
  const[showPicker,setShowPicker]=useState(false);
  const[formErr,setFormErr]=useState({});
  const[catFilter,setCatFilter]=useState(null);
  const descRef=useRef(null);

  useEffect(()=>{(async()=>{
    const[ex,bu,ca,nm,th]=await Promise.all([loadKey('ww_exp'),loadKey('ww_bud'),loadKey('ww_cats'),loadKey('ww_name'),loadKey('ww_theme')]);
    if(ex)setExp(ex);if(bu){setBudgets(bu);setBudDraft(bu);}if(ca)setCats(ca);if(nm)setAppName(nm);if(th)setThemeId(th);
    setReady(true);
  })();},[]);
  useEffect(()=>{if(ready)saveKey('ww_exp',expenses);},[expenses,ready]);
  useEffect(()=>{if(ready)saveKey('ww_bud',budgets);},[budgets,ready]);
  useEffect(()=>{if(ready)saveKey('ww_cats',cats);},[cats,ready]);
  useEffect(()=>{if(ready&&appName)saveKey('ww_name',appName);},[appName,ready]);
  useEffect(()=>{
    const t=THEMES.find(x=>x.id===themeId)||THEMES[0];
    Object.entries(t.vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
    paintBackground(t);
    if(ready)saveKey('ww_theme',themeId);
    if(t.bgKind!=='scene')return;
    let raf=null;
    const onResize=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>paintBackground(t));};
    window.addEventListener('resize',onResize);
    return()=>{window.removeEventListener('resize',onResize);cancelAnimationFrame(raf);};
  },[themeId,ready]);
  useEffect(()=>{if(tab==='add')setTimeout(()=>descRef.current?.focus(),160);},[tab,editId]);

  const catById=id=>cats.find(c=>c.id===id);

  const monthList=useMemo(()=>{
    const cur=curYm();if(!expenses.length)return[cur];
    const earliest=expenses.map(e=>e.date.slice(0,7)).sort()[0];
    const[ey,em]=earliest.split('-').map(Number);
    const list=[];let d=new Date(ey,em-1);
    const now=new Date(),end=new Date(now.getFullYear(),now.getMonth());
    while(d<=end){list.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);d=new Date(d.getFullYear(),d.getMonth()+1);}
    return list.reverse();
  },[expenses]);

  const histByYear=useMemo(()=>{const g={};monthList.forEach(m=>{const y=m.slice(0,4);(g[y]=g[y]||[]).push(m);});return Object.entries(g).sort(([a],[b])=>b-a);},[monthList]);
  const getMonthTotals=m=>{const ex=expenses.filter(e=>e.date.startsWith(m));return{spent:ex.reduce((s,e)=>s+Number(e.amount),0),count:ex.length};};

  // Category filter
  const catAllExps=useMemo(()=>{
    if(!catFilter)return[];
    return expenses.filter(e=>e.category===catFilter).sort((a,b)=>b.date.localeCompare(a.date));
  },[catFilter,expenses]);
  const catTotal=useMemo(()=>catAllExps.reduce((s,e)=>s+Number(e.amount),0),[catAllExps]);
  const catByMonth=useMemo(()=>{
    const g={};catAllExps.forEach(exp=>{const m=exp.date.slice(0,7);(g[m]=g[m]||[]).push(exp);});
    return Object.entries(g).sort(([a],[b])=>b.localeCompare(a));
  },[catAllExps]);

  // Current month
  const monthExp=expenses.filter(e=>e.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date));
  const spending=cats.reduce((acc,c)=>{acc[c.id]=monthExp.filter(e=>e.category===c.id).reduce((s,e)=>s+Number(e.amount),0);return acc;},{});
  const totalSpent=Object.values(spending).reduce((a,b)=>a+b,0);
  const totalBudget=cats.reduce((s,c)=>s+(budgets[c.id]||0),0);
  const remaining=totalBudget-totalSpent;
  const budPct=totalBudget>0?Math.min(Math.round((totalSpent/totalBudget)*100),100):0;
  const isOver=totalSpent>totalBudget&&totalBudget>0;
  const chartData=cats.filter(c=>spending[c.id]>0).map(c=>({id:c.id,name:c.label,value:spending[c.id],color:c.color}));
  const filteredCat=catFilter?catById(catFilter):null;

  const changeMonth=dir=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+dir);setYm(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);};
  const submit=()=>{
    const errs={};if(!form.description.trim())errs.description=true;if(!form.amount)errs.amount=true;
    if(Object.keys(errs).length){setFormErr(errs);return;}setFormErr({});
    const entry={...form,amount:parseFloat(form.amount)};
    if(editId!==null){setExp(p=>p.map(e=>e.id===editId?{...entry,id:editId}:e));setEditId(null);}
    else setExp(p=>[...p,{...entry,id:Date.now()}]);
    setForm({date:today(),category:cats[0]?.id||'',description:'',amount:'',notes:''});setTab('home');
  };
  const startEdit=exp=>{setForm({date:exp.date,category:exp.category,description:exp.description,amount:String(exp.amount),notes:exp.notes||''});setEditId(exp.id);setTab('add');};
  const cancelEdit=()=>{setEditId(null);setFormErr({});setForm({date:today(),category:cats[0]?.id||'',description:'',amount:'',notes:''});setTab('home');};
  const addCat=()=>{if(!newCat.label.trim())return;const id='cat_'+Date.now();setCats(p=>[...p,{id,label:newCat.label.trim(),color:newCat.color}]);setBudgets(b=>({...b,[id]:0}));setBudDraft(b=>({...b,[id]:0}));setNewCat({label:'',color:'#D85A30'});};
  const delCat=id=>{setCats(p=>p.filter(c=>c.id!==id));setExp(p=>p.filter(e=>e.category!==id));setBudgets(b=>{const n={...b};delete n[id];return n;});setBudDraft(b=>{const n={...b};delete n[id];return n;});setDelCatId(null);};
  const saveBudgets=()=>{setBudgets(budDraft);setSaved(true);setTimeout(()=>setSaved(false),1500);};
  const sf=k=>ev=>{setForm(f=>({...f,[k]:ev.target.value}));setFormErr(f=>({...f,[k]:false}));};
  const goTo=t=>{
    if(t!=='home')setCatFilter(null);
    if(t==='add'&&!editId){setForm({date:today(),category:cats[0]?.id||'',description:'',amount:'',notes:''});setFormErr({});}
    if(t==='settings')setBudDraft({...budgets});
    setTab(t);
  };

  const e=React.createElement;
  if(!ready)return e('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--text-muted)',fontFamily:"'Caprasimo',cursive",fontSize:18}},(appName||'Expense Tracker')+' 🎀');

  // Reusable transaction row list
  const txnRows=exps=>exps.map(exp=>{
    const c=catById(exp.category),isDel=delExpId===exp.id;
    return e('div',{key:exp.id,style:{borderRadius:12,overflow:'hidden',marginBottom:4}},
      e('div',{className:'txn-row'},
        e('div',{style:{display:'flex',alignItems:'center',gap:10,minWidth:0}},
          e('div',{style:{width:40,height:40,borderRadius:13,background:(c?.color||'#888')+'28',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
            e('div',{style:{width:12,height:12,borderRadius:'50%',background:c?.color||'#888'}})
          ),
          e('div',{style:{minWidth:0}},
            e('p',{style:{fontSize:14,fontWeight:600,margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},exp.description),
            e('p',{style:{fontSize:11,color:'var(--text-faint)',margin:'2px 0 0'}},
              new Date(exp.date+'T00:00:00').toLocaleDateString('en-SG',{day:'numeric',month:'short'}),
              exp.notes&&e('span',{style:{color:'var(--text-muted)'}},' · '+exp.notes)
            )
          )
        ),
        e('div',{style:{display:'flex',alignItems:'center',gap:2,flexShrink:0,marginLeft:8}},
          e('span',{style:{fontSize:14,fontWeight:700,marginRight:2}},'S$'+fmt(exp.amount)),
          e('button',{onClick:()=>startEdit(exp),className:'icon-btn','aria-label':'Edit'},'✏️'),
          e('button',{onClick:()=>setDelExpId(isDel?null:exp.id),className:'icon-btn',style:{color:isDel?'var(--danger)':'var(--text-muted)'},'aria-label':'Delete'},'🗑️')
        )
      ),
      isDel&&e('div',{className:'danger-zone',style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
        e('span',{style:{fontSize:12,color:'var(--danger)'}},'Remove this entry?'),
        e('div',{style:{display:'flex',gap:8}},
          e('button',{onClick:()=>setDelExpId(null),style:{fontSize:12,padding:'5px 12px'}},'Cancel'),
          e('button',{onClick:()=>{setExp(p=>p.filter(ex=>ex.id!==exp.id));setDelExpId(null);},style:{fontSize:12,padding:'5px 12px',color:'var(--danger)',borderColor:'var(--danger-border)'}},'Delete')
        )
      )
    );
  });

  return e('div',null,

    // Month picker modal
    showPicker&&e('div',{className:'overlay',onClick:ev=>{if(ev.target===ev.currentTarget)setShowPicker(false);}},

        e('p',{style:{textAlign:'center',fontFamily:"'Caprasimo',cursive",fontSize:14,color:'var(--label)',marginBottom:'0.75rem'}},'Select month'),
        histByYear.map(([year,months])=>e(React.Fragment,{key:year},
          e('div',{className:'yr-hdr'},year),
          months.map(m=>{
            const{spent,count}=getMonthTotals(m);
            return e('div',{key:m,className:'m-item'+(ym===m?' sel':''),onClick:()=>{setYm(m);setShowPicker(false);setTab('home');}},
              e('div',null,
                e('span',{style:{fontSize:15,fontWeight:ym===m?700:400,color:ym===m?'var(--accent)':'var(--text)'}},ymLabel(m)),
                count>0&&e('span',{style:{fontSize:11,color:'var(--text-muted)',marginLeft:8}},count+' entries')

      // ── Header ──

          :catByMonth.map(([m,exps])=>e('div',{key:m,className:'card'},
              e('p',{className:'lbl'},ymLabel(m)),
              txnRows(exps)
            ))
      ),

      // ══ HOME — Normal view ══
      tab==='home'&&!catFilter&&e(React.Fragment,null,
        e('div',{className:'card'},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:13}},
            e('div',null,
              e('p',{style:{fontSize:12,color:'var(--text-muted)',margin:'0 0 4px'}},'Total spent'),
              e('div',{className:'display',style:{fontSize:'2rem',color:isOver?'var(--danger)':'var(--text)',lineHeight:1}},'S$'+fmt(totalSpent)),
              e('p',{style:{fontSize:12,color:'var(--text-faint)',margin:'4px 0 0'}},'of S$'+fmt(totalBudget)+' budget')
            ),
            e('div',{style:{textAlign:'right'}},
              e('p',{style:{fontSize:12,color:'var(--text-muted)',margin:'0 0 4px'}},'Remaining'),
              e('div',{className:'display',style:{fontSize:'1.45rem',color:remaining>=0?'var(--success)':'var(--danger)',lineHeight:1}},(remaining<0?'-':'')+'S$'+fmt(Math.abs(remaining))),
              e('p',{style:{fontSize:11,color:remaining>=0?'var(--success)':'var(--danger)',margin:'4px 0 0'}},remaining>=0?'under budget 🌸':'over budget')
            )
          ),
          e('div',{className:'progress-track'},e('div',{className:'progress-fill',style:{width:budPct+'%',background:isOver?'var(--danger)':'var(--accent)'}})),
          e('p',{style:{fontSize:11,color:'var(--text-muted)',margin:'5px 0 0',textAlign:'right'}},budPct+'% used')
        ),
        e('div',{className:'card'},
          e('p',{className:'lbl'},'Spending breakdown'),
          chartData.length>0
            ?e('div',{style:{display:'flex',alignItems:'center',gap:16}},
                e(Donut,{data:chartData,size:130,inner:38,outer:58}),
                e('div',{style:{flex:1,minWidth:0}},chartData.map((item,i)=>e('div',{key:i,onClick:()=>setCatFilter(item.id),style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9,cursor:'pointer',padding:'2px 4px',borderRadius:8}},
                  e('div',{style:{display:'flex',alignItems:'center',gap:7,minWidth:0}},
                    e('div',{style:{width:9,height:9,borderRadius:'50%',background:item.color,flexShrink:0}}),
                    e('span',{style:{fontSize:13,color:'var(--text-sub)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},item.name)
                  ),
                  e('div',{style:{display:'flex',alignItems:'center',gap:4,flexShrink:0}},
                    e('span',{style:{fontSize:13,fontWeight:700}},'S$'+fmt(item.value)),
                    e('span',{style:{fontSize:12,color:'var(--chevron)'}},'›')
                  )
                )))
              )
            :e('p',{style:{fontSize:14,color:'var(--text-muted)',textAlign:'center',padding:'1rem 0'}},'No expenses yet this month 🎀')
        ),
        e('div',{className:'card'},
          e('p',{className:'lbl'},'Budget by category — tap to view ›'),
          cats.map(c=>{
            const spent=spending[c.id]||0,budget=budgets[c.id]||0,over=spent>budget&&budget>0;
            const pct=budget>0?Math.min(Math.round((spent/budget)*100),100):0;
            return e('div',{key:c.id,className:'cat-row',onClick:()=>setCatFilter(c.id)},
              e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}},
                e('div',{style:{display:'flex',alignItems:'center',gap:7}},
                  e('div',{style:{width:10,height:10,borderRadius:'50%',background:c.color,flexShrink:0}}),
                  e('span',{style:{fontSize:14}},c.label)
                ),
                e('div',{style:{display:'flex',alignItems:'center',gap:6}},
                  e('span',{style:{fontSize:12,color:over?'var(--danger)':'var(--text-faint)'}},budget>0?'S$'+fmt(spent)+' / S$'+fmt(budget):'S$'+fmt(spent)),
                  e('span',{style:{fontSize:14,color:'var(--chevron)'}},'›')
                )
              ),
              budget>0
                ?e('div',{className:'progress-track'},e('div',{className:'progress-fill',style:{width:pct+'%',background:over?'var(--danger)':c.color}}))
                :e('p',{style:{fontSize:11,color:'var(--text-muted)',margin:'2px 0 0',fontStyle:'italic'}},'No budget set')
            );
          })
        ),
        monthExp.length>0&&e('div',{className:'card'},
          e('p',{className:'lbl'},'Transactions'),
          txnRows(monthExp)
        )
      ),

      // ══ HISTORY ══
      tab==='history'&&e(React.Fragment,null,
        expenses.length===0
          ?e('div',{className:'card',style:{textAlign:'center',padding:'2.5rem 1rem'}},
              e('p',{style:{fontSize:32,marginBottom:12}},'🎀'),
              e('p',{className:'display',style:{fontSize:15,color:'var(--text-sub)'}},'No history yet'),
              e('p',{style:{fontSize:13,color:'var(--text-muted)',marginTop:8}},'Add your first expense to see monthly totals here!')
            )
          :histByYear.map(([year,months])=>
              e('div',{key:year,className:'card'},
                e('p',{className:'lbl'},year),
                months.map((m,i)=>{
                  const{spent,count}=getMonthTotals(m);
                  const isCur=m===curYm(),isSel=m===ym;
                  const pct=totalBudget>0?Math.min(Math.round((spent/totalBudget)*100),100):0;
                  return e('div',{key:m},
                    i>0&&e('div',{style:{height:1,background:'rgba(var(--border-rgb),0.2)',margin:'2px 0'}}),
                    e('div',{className:'hist-row',onClick:()=>{setYm(m);setTab('home');}},
                      e('div',null,
                        e('div',{style:{display:'flex',alignItems:'center',gap:7,marginBottom:3}},
                          e('span',{style:{fontSize:15,fontWeight:600,color:isSel?'var(--accent)':'var(--text)'}},ymLabel(m)),
                          isCur&&e('span',{style:{fontSize:10,background:'rgba(var(--accent-rgb),0.16)',color:'var(--accent)',padding:'2px 8px',borderRadius:20,fontWeight:700}},'NOW')
                        ),
                        e('span',{style:{fontSize:12,color:'var(--text-muted)'}},count>0?count+' transaction'+(count!==1?'s':''):'No entries')
                      ),
                      e('div',{style:{display:'flex',alignItems:'center',gap:8}},
                        e('div',{className:'display',style:{fontSize:'1.05rem',color:spent>0?'var(--text)':'var(--text-muted)'}},spent>0?'S$'+fmt(spent):'—'),
                        e('span',{style:{fontSize:18,color:'var(--chevron)',lineHeight:1}},'›')
                      )
                    ),
                    spent>0&&totalBudget>0&&e('div',{className:'progress-track',style:{margin:'0 4px 6px'}},
                      e('div',{className:'progress-fill',style:{width:pct+'%',background:pct>=100?'var(--danger)':'var(--accent)',opacity:.6}})
                    )
                  );
                })
              )
            )
      ),

      // ══ ADD / EDIT ══
      tab==='add'&&e('div',{className:'card'},
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.25rem'}},
          e('h2',{className:'display',style:{fontSize:'1.3rem',color:'var(--text)'}},editId?'Edit expense ✏️':'New expense 🎀'),
          editId&&e('button',{onClick:cancelEdit,className:'cancel-link'},'Cancel')
        ),
        e('div',{className:'field'},e('label',null,'Description'),
          e('input',{ref:descRef,type:'text',placeholder:'e.g. Grab to Orchard',value:form.description,onChange:sf('description'),className:formErr.description?'err':'',autoComplete:'off',autoCorrect:'off'})
        ),
        e('div',{className:'field'},e('label',null,'Amount (SGD)'),
          e('input',{type:'number',inputMode:'decimal',placeholder:'0.00',min:'0',step:'0.01',value:form.amount,onChange:sf('amount'),className:formErr.amount?'err':''})
        ),
        e('div',{className:'field'},e('label',null,'Category'),
          e('select',{value:form.category,onChange:sf('category')},cats.map(c=>e('option',{key:c.id,value:c.id},c.label)))
        ),
        e('div',{className:'field'},e('label',null,'Date'),e('input',{type:'date',value:form.date,onChange:sf('date')})),
        e('div',{style:{marginBottom:'1.25rem'}},
          e('label',{style:{fontSize:13,color:'var(--text-sub)',display:'block',marginBottom:5}},'Notes (optional)'),
          e('input',{type:'text',placeholder:'e.g. split with friends',value:form.notes,onChange:sf('notes')})
        ),
        Object.values(formErr).some(Boolean)&&e('p',{style:{fontSize:12,color:'var(--danger)',marginBottom:'0.75rem',textAlign:'center'}},'Please fill in the highlighted fields 🎀'),
        e('button',{onClick:submit,className:'btn-primary',style:{width:'100%',padding:'14px',fontSize:15}},editId?'Save changes':'Add expense')
      ),

      // ══ SETTINGS ══
      tab==='settings'&&e(React.Fragment,null,
        e('div',{className:'card'},
          e('h2',{className:'display',style:{fontSize:'1.3rem',margin:'0 0 1.2rem',color:'var(--text)'}},'Theme 🎨'),
          e('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:10}},
            THEMES.map(t=>e('div',{key:t.id,className:'theme-card'+(themeId===t.id?' sel':''),onClick:()=>setThemeId(t.id)},
              e('div',{style:{display:'flex',alignItems:'center',gap:9}},
                e('div',{style:{width:30,height:30,borderRadius:'50%',background:'linear-gradient(135deg,'+t.preview[0]+','+t.preview[1]+')',border:'2.5px solid '+t.vars['--accent'],flexShrink:0}}),
                e('div',{style:{minWidth:0}},
                  e('p',{style:{fontSize:13,fontWeight:600,color:'var(--text)',margin:0,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},t.emoji+' '+t.name),
                  themeId===t.id&&e('p',{style:{fontSize:11,color:t.vars['--accent'],margin:'2px 0 0'}},'Selected')
                )
              )
            ))
          )
        ),
        e('div',{className:'card'},
          e('h2',{className:'display',style:{fontSize:'1.3rem',margin:'0 0 1.2rem',color:'var(--text)'}},'App name 🎀'),
          e('div',{className:'field'},
            e('label',null,'Your name for this app'),
            e('input',{type:'text',placeholder:'Expense Tracker',value:appName,onChange:ev=>setAppName(ev.target.value),maxLength:30})
          ),
          e('p',{style:{fontSize:11,color:'var(--text-muted)',marginTop:-4}},'Updates the title shown at the top')
        ),
        e('div',{className:'card'},
          e('h2',{className:'display',style:{fontSize:'1.3rem',margin:'0 0 1.2rem',color:'var(--text)'}},'Monthly budgets 💰'),
          cats.map(c=>e('div',{key:c.id,className:'field'},
            e('label',{style:{display:'flex',alignItems:'center',gap:6}},
              e('div',{style:{width:10,height:10,borderRadius:'50%',background:c.color,flexShrink:0}}),c.label
            ),
            e('input',{type:'number',inputMode:'decimal',min:'0',step:'1',value:budDraft[c.id]??0,onChange:ev=>setBudDraft(b=>({...b,[c.id]:parseFloat(ev.target.value)||0}))})
          )),
          e('div',{style:{background:'rgba(var(--tint-rgb),0.55)',borderRadius:13,padding:'11px 14px',display:'flex',justifyContent:'space-between',marginBottom:'1.2rem'}},
            e('span',{style:{fontSize:14,color:'var(--text-sub)'}},'Total monthly budget'),
            e('span',{className:'display',style:{fontSize:'1rem',color:'var(--text)'}},'S$'+fmt(cats.reduce((s,c)=>s+(budDraft[c.id]||0),0)))
          ),
          e('button',{onClick:saveBudgets,className:'btn-primary',style:{width:'100%',padding:'14px',fontSize:15}},saved?'✓ Saved!':'Save budgets')
        ),
        e('div',{className:'card'},
          e('h2',{className:'display',style:{fontSize:'1.3rem',margin:'0 0 1.2rem',color:'var(--text)'}},'Categories 🎀'),
          cats.map(c=>{const isDel=delCatId===c.id;return e('div',{key:c.id,style:{borderRadius:12,overflow:'hidden',marginBottom:4}},
            e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 4px'}},
              e('div',{style:{display:'flex',alignItems:'center',gap:9}},
                e('div',{style:{width:14,height:14,borderRadius:'50%',background:c.color,flexShrink:0}}),
                e('span',{style:{fontSize:15}},c.label)
              ),
              e('button',{onClick:()=>setDelCatId(isDel?null:c.id),className:'icon-btn',style:{color:isDel?'var(--danger)':'var(--text-muted)'},'aria-label':'Delete '+c.label},'🗑️')
            ),
            isDel&&e('div',{className:'danger-zone'},
              e('p',{style:{fontSize:12,color:'var(--danger)',marginBottom:8}},'"'+c.label+'" and all its expenses will be deleted.'),
              e('div',{style:{display:'flex',gap:8}},
                e('button',{onClick:()=>setDelCatId(null),style:{fontSize:13,padding:'6px 14px'}},'Cancel'),
                e('button',{onClick:()=>delCat(c.id),style:{fontSize:13,padding:'6px 14px',color:'var(--danger)',borderColor:'var(--danger-border)'}},'Yes, delete')
              )
            )
          );}),
          e('div',{style:{borderTop:'1px solid rgba(var(--border-rgb),0.3)',marginTop:'1rem',paddingTop:'1rem'}},
            e('p',{style:{fontSize:13,color:'var(--text-sub)',marginBottom:10,fontWeight:500}},'Add new category'),
            e('input',{type:'text',placeholder:'e.g. Gifts, Travel, Gym...',value:newCat.label,onChange:ev=>setNewCat(n=>({...n,label:ev.target.value})),style:{marginBottom:10}}),
            e('div',{style:{display:'flex',flexWrap:'wrap',gap:10,marginBottom:14}},
              PALETTE.map(col=>e('div',{key:col,onClick:()=>setNewCat(n=>({...n,color:col})),className:'swatch'+(newCat.color===col?' sel':''),style:{background:col}}))
            ),
            e('button',{onClick:addCat,className:'btn-primary',style:{width:'100%',padding:'14px',fontSize:15}},'+ Add category')
          )
        )
      ),

      // Footer
      e('p',{style:{textAlign:'center',fontSize:11,color:'rgba(var(--credit-rgb),0.5)',padding:'0.75rem 0 0.25rem',letterSpacing:'0.03em'}},'made by @wakii___')
    ),

    // ── Bottom nav ──
    e('nav',{className:'bottom-nav','aria-label':'Main navigation'},
      [{id:'home',label:'Home'},{id:'history',label:'History'},{id:'add',label:'Add'},{id:'settings',label:'Settings'}]
        .map(item=>e('button',{key:item.id,className:'nav-btn'+(tab===item.id?' active':''),onClick:()=>goTo(item.id),'aria-label':item.label},
          e(NavIcon,{id:item.id}),e('span',null,item.label)
        ))
    )
  );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
